<!doctype html>s
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría UX — Mi Argentina</title>
<meta name="description" content="Evaluación de leyes UX y heurísticas de Nielsen sobre la app Mi Argentina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__inner">
    <div class="masthead__id">
      <span class="masthead__tag">EXPEDIENTE DE EVALUACIÓN</span>
      <h1 class="masthead__title">Auditoría UX<br>Mi&nbsp;Argentina</h1>
    </div>
    <div class="masthead__meta">
      <dl>
        <dt>Producto evaluado</dt>
        <dd>App "Mi Argentina" (iOS / Android)</dd>
        <dt>Método</dt>
        <dd>Checklist de 14 leyes UX + heurísticas de Nielsen</dd>
        <dt>Estado</dt>
        <dd id="meta-estado">En curso</dd>
      </dl>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Selección de tablero">
  <button class="tabs__btn is-active" data-tab="leyes" id="tab-btn-leyes">
    <span class="tabs__num">01</span>
    <span class="tabs__label">Tablero 1<br>Leyes UX</span>
    <span class="tabs__count" id="count-leyes">0/14</span>
  </button>
  <button class="tabs__btn" data-tab="heuristicas" id="tab-btn-heuristicas">
    <span class="tabs__num">02</span>
    <span class="tabs__label">Tablero 2<br>Heurísticas de Nielsen</span>
    <span class="tabs__count" id="count-heuristicas">0/10</span>
  </button>
</nav>

<div class="summary" id="summary-leyes">
  <button class="summary__btn summary__btn--all is-active" data-filter="todos">Todos</button>
  <button class="summary__btn summary__btn--cumple" data-filter="cumple"><span class="summary__dot summary__dot--cumple"></span>Cumple <strong id="sum-cumple">0</strong></button>
  <button class="summary__btn summary__btn--rompe" data-filter="rompe"><span class="summary__dot summary__dot--rompe"></span>Rompe <strong id="sum-rompe">0</strong></button>
</div>

<main>
  <section id="panel-leyes" class="panel is-active" aria-labelledby="tab-btn-leyes">
    <div class="panel__layout">
      <nav class="index" id="index-leyes" aria-label="Índice de leyes"></nav>
      <div class="ledger" id="ledger-leyes"></div>
    </div>
  </section>

  <section id="panel-heuristicas" class="panel" aria-labelledby="tab-btn-heuristicas">
    <div class="panel__layout">
      <nav class="index" id="index-heuristicas" aria-label="Índice de heurísticas"></nav>
      <div class="ledger" id="ledger-heuristicas"></div>
    </div>
  </section>
</main>

<footer class="colophon">
  <button class="download-pdf" onclick="descargarPDF()" title="Descargar auditoría como PDF">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Descargar PDF
  </button>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
